name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Build
        run: make build
      - name: Package
        run: ditto -c -k --keepParent build/Farol.app build/Farol-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Farol-dev
          path: build/Farol-dev.zip
